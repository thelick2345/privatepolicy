<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodSprint 技术支持</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.8;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 18px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            background: #e5e5ea;
            margin: 24px 0;
        }

        p {
            font-size: 15px;
            color: #3a3a3c;
            margin-bottom: 12px;
        }

        .email-box {
            background: #f8f8fa;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 20px 0 10px 0;
            display: inline-block;
        }

        .email-box a {
            font-size: 18px;
            font-weight: 600;
            color: #007aff;
            text-decoration: none;
        }

        .email-box a:hover {
            text-decoration: underline;
        }

        .response-time {
            color: #86868b;
            font-size: 13px;
            margin-top: 6px;
        }

        .footer {
            margin-top: 28px;
            color: #aeaeb2;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .email-box a {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="icon">💬</div>

        <h1>GoodSprint 技术支持</h1>
        <p class="subtitle">你的目标，好节奏</p>

        <div class="divider"></div>
        <p><a href="https://jazzmaster.top/apps/goodsprint/">Good Sprint应用介绍</a></p>
        <p>如果你在使用过程中遇到任何问题，<br />或者有任何建议想告诉我们，</p>

        <p style="font-weight:500;color:#1d1d1f;">欢迎随时联系我们 👇</p>

        <div class="email-box">
            <a href="mailto:thelick2345@gmail.com">thelick2345@gmail.com</a>
        </div>

        <p class="response-time">我们会尽快回复你 🚀</p>
        

        <div class="divider"></div>

        <p style="font-size:14px;color:#86868b;">
            也欢迎你分享使用 GoodSprint 的感受和想法 ❤️
        </p>

        <div class="footer">
            GoodSprint · 用你自己的节奏，实现目标
        </div>

    </div>

</body>
</html>
